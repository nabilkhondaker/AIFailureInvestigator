[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-failure-investigator"
version = "0.1.0"
description = "AI system for investigating faults in rotating mechanical machinery using multi-sensor data, signal processing, and machine learning."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nabil Khondaker" }
]
requires-python = ">=3.10"
keywords = [
    "machine-learning",
    "condition-monitoring",
    "fault-diagnosis",
    "signal-processing",
    "rotating-machinery",
    "anomaly-detection",
    "reliability-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.4",
    "jupyter>=1.0",
    "ipykernel>=6.25",
]
dashboard = [
    "streamlit>=1.28",
]
all = [
    "machine-failure-investigator[dev,dashboard]",
]

[project.scripts]
neural-failure = "machine_failure_investigator.cli.main:app"

[project.urls]
Homepage = "https://github.com/nabilkhondaker/ai-machine-failure-investigator"
Documentation = "https://github.com/nabilkhondaker/ai-machine-failure-investigator#readme"
Repository = "https://github.com/nabilkhondaker/ai-machine-failure-investigator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
machine_failure_investigator = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
