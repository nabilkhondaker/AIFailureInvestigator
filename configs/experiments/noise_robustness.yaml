name: noise_robustness
seed: 42
description: Evaluate diagnosis under increasing sensor noise

noise_levels: [0.01, 0.05, 0.10, 0.20, 0.40]
data:
  path: data/synthetic
  n_samples: 800

models:
  - fault_classifier

metrics:
  - accuracy
  - macro_f1

output_dir: outputs/experiments/noise_robustness
