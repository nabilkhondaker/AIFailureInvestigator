# Default synthetic dataset generation

seed: 42
n_samples: 2000
sampling_rate_hz: 5120.0
duration_s: 1.0
window_overlap: 0.0

rpm_range: [800.0, 3000.0]
load_range: [0.3, 1.0]

fault_distribution:
  HEALTHY: 0.25
  BEARING_DEGRADATION: 0.12
  BEARING_FAILURE: 0.08
  IMBALANCE: 0.12
  MISALIGNMENT: 0.10
  LOOSENESS: 0.08
  GEAR_WEAR: 0.08
  LUBRICATION_FAILURE: 0.07
  OVERHEATING: 0.05
  SHAFT_DEFECT: 0.05

severity_range: [0.1, 1.0]
include_sensor_faults: false
sensor_fault_rate: 0.02

split:
  train: 0.70
  val: 0.15
  test: 0.15
  strategy: by_scenario   # avoid leakage across windows of the same run

output_dir: data/synthetic
format: npz
